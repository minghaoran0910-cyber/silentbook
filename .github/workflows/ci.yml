name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest "httpx==0.27.0"
      - name: 回归测试（全量，2026-09-07 起 609 用例绿）
        env:
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-0123456789abcdef-test
          WEBHOOK_SECRET: test-shared-secret-0123456789abcdef
          WEBHOOK_USER_ID: "1"
          DATABASE_URL: sqlite:////tmp/ci.db
        run: python -m pytest tests/ -q -p no:randomly

  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest "httpx==0.27.0"
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx nuxt build
