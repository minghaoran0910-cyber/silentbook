name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest httpx
      - name: 回归测试（当前绿基线）
        env:
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-0123456789abcdef-test
          WEBHOOK_SECRET: test-shared-secret-0123456789abcdef
          WEBHOOK_USER_ID: "1"
          DATABASE_URL: sqlite:////tmp/ci.db
        run: >
          python -m pytest tests/test_ledger_guards.py
          tests/test_webhook_idempotency.py tests/test_fx.py
          tests/test_migrations.py tests/test_tenant_isolation.py
          tests/test_hide_noise.py -q

  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest httpx
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx nuxt build
